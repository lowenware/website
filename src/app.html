<!doctype html>
<html lang="%lang%">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" id="favicon" href="/favicon-light.svg" type="image/svg+xml" />
    <script>
      (function () {
        const link = document.getElementById('favicon');
        const setFavicon = (dark) => {
          link.href = dark ? '/favicon-dark.svg' : '/favicon-light.svg';
        };
        const mq = window.matchMedia('(prefers-color-scheme: dark)');
        setFavicon(mq.matches);
        mq.addEventListener('change', (e) => setFavicon(e.matches));
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
