name: Löwenware Website Deploy

on:
  push:
    branches: [master, staging]

jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Install SSH Key
        uses: lowenware/ssh-key-action@v2
        with:
          key: ${{ secrets.LOWENWARE_WEBSITE_SSH }}
          known_hosts: lowenware-host
      - name: Add Known Hosts
        run: ssh-keyscan -H ${{ secrets.LOWENWARE_SSH_HOST }} >> ~/.ssh/known_hosts
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload
        run: rsync -avz ./build/ ${{ secrets.LOWENWARE_SSH_USER }}@${{ secrets.LOWENWARE_SSH_HOST }}:/srv/www/lowenware.com/
